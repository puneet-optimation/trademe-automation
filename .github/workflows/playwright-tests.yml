name: 🎭 TradeMe Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - regression
        - visual
        - specific
      test_pattern:
        description: 'Test pattern (for specific tests)'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
        
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📋 Debug package files before cleanup
      run: |
        echo "=== Before cleanup ==="
        echo "Package.json contents:"
        cat package.json
        echo ""
        echo "Package-lock.json exists: $(test -f package-lock.json && echo 'yes' || echo 'no')"
        if [ -f package-lock.json ]; then
          echo "Package-lock.json size: $(wc -c < package-lock.json) bytes"
        fi
        
    - name: 🧹 Clean npm environment and remove corrupted files
      run: |
        echo "=== Cleaning npm environment ==="
        # Remove existing lock file and node_modules to start fresh
        rm -rf node_modules package-lock.json .npm
        # Clean npm cache completely
        npm cache clean --force
        # Verify cache is clean
        npm cache verify
        echo "Cleanup completed successfully"
        
    - name: 📦 Install dependencies fresh
      run: |
        echo "=== Installing dependencies from scratch ==="
        # Install dependencies fresh - this will create a new lock file with correct checksums
        npm install --no-audit --no-fund
        echo "Dependencies installed successfully"
        
    - name: 📋 Debug package files after install
      run: |
        echo "=== After fresh install ==="
        echo "Package-lock.json exists: $(test -f package-lock.json && echo 'yes' || echo 'no')"
        if [ -f package-lock.json ]; then
          echo "Package-lock.json size: $(wc -c < package-lock.json) bytes"
          echo "Lock file version: $(node -e "console.log(require('./package-lock.json').lockfileVersion)")"
        fi
        echo "Node modules: $(ls -la node_modules | wc -l) entries"
        
    - name: 🔧 Update system packages  
      run: sudo apt-get update

    - name: 📋 Install system dependencies
      run: |
        sudo apt-get install -y \
          libasound2-dev \
          libatk-bridge2.0-0 \
          libdrm2 \
          libxkbcommon0 \
          libxrandr2 \
          libxdamage1 \
          libxfixes3 \
          libxss1 \
          libgconf-2-4

    - name: 🎭 Install Playwright system dependencies
      run: npx playwright install-deps chromium

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install chromium

    - name: ✅ Verify Playwright installation
      run: |
        npx playwright --version
        echo "Playwright installation completed successfully"

    - name: 🧪 Run Playwright tests - All
      if: ${{ inputs.test_type == 'all' || inputs.test_type == '' }}
      run: npx playwright test --project=chromium

    - name: 🧪 Run Regression tests
      if: ${{ inputs.test_type == 'regression' }}
      run: npx playwright test tests/trademe-regression.spec.ts --project=chromium

    - name: 🧪 Run Visual tests
      if: ${{ inputs.test_type == 'visual' }}
      run: npx playwright test tests/visual-regression.spec.ts --project=chromium

    - name: 🧪 Run Specific tests
      if: ${{ inputs.test_type == 'specific' && inputs.test_pattern != '' }}
      run: npx playwright test --grep="${{ inputs.test_pattern }}" --project=chromium

    - name: 📊 Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: 📋 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30

    - name: 📸 Upload Screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots-${{ github.run_number }}
        path: test-results/
        retention-days: 7

  publish-results:
    needs: [test]
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: 📥 Download test artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: test-results/
      continue-on-error: true

    - name: 📊 Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Playwright Test Results
        path: 'test-results/results.xml'
        reporter: java-junit
        fail-on-error: false
      continue-on-error: true

    - name: 💬 Comment PR with Test Results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          
          try {
            if (fs.existsSync('test-results/results.json')) {
              const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
              
              const comment = `## 🎭 Playwright Test Results (Chromium)
              
              | Total | ✅ Passed | ❌ Failed | ⏱️ Duration |
              |-------|----------|----------|-------------|
              | ${results.stats?.total || 0} | ${results.stats?.passed || 0} | ${results.stats?.failed || 0} | ${Math.round((results.stats?.duration || 0) / 1000)}s |
              
              ${(results.stats?.failed || 0) > 0 ? '❌ Some tests failed. Check the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.' : '✅ All tests passed!'}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              console.log('Test results file not found');
            }
          } catch (error) {
            console.log('Could not parse test results:', error.message);
          }
