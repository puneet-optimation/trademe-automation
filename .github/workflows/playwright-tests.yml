name: 🎭 TradeMe Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - regression
        - visual
        - specific
      test_pattern:
        description: 'Test pattern (for specific tests)'
        required: false
        default: ''

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
        
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 🧹 Clean npm cache
      run: npm cache clean --force

    - name: 📦 Install dependencies (without cache)
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: 🧪 Run Playwright tests - All
      if: ${{ inputs.test_type == 'all' || inputs.test_type == '' }}
      run: npx playwright test --project=chromium

    - name: 🧪 Run Regression tests
      if: ${{ inputs.test_type == 'regression' }}
      run: npx playwright test tests/trademe-regression.spec.ts --project=chromium

    - name: 🧪 Run Visual tests
      if: ${{ inputs.test_type == 'visual' }}
      run: npx playwright test tests/visual-regression.spec.ts --project=chromium

    - name: 🧪 Run Specific tests
      if: ${{ inputs.test_type == 'specific' && inputs.test_pattern != '' }}
      run: npx playwright test --grep="${{ inputs.test_pattern }}" --project=chromium

    - name: 📊 Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: 📋 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30

    - name: 📸 Upload Screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots-${{ github.run_number }}
        path: test-results/
        retention-days: 7

  publish-results:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: 📥 Download test artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-results
        path: test-results/
      continue-on-error: true

    - name: 📊 Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Playwright Test Results
        path: 'test-results/results.xml'
        reporter: java-junit
        fail-on-error: false
      continue-on-error: true

    - name: 💬 Comment PR with Test Results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          
          try {
            if (fs.existsSync('test-results/results.json')) {
              const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
              
              const comment = `## 🎭 Playwright Test Results (Chromium)
              
              | Total | ✅ Passed | ❌ Failed | ⏱️ Duration |
              |-------|----------|----------|-------------|
              | ${results.stats?.total || 0} | ${results.stats?.passed || 0} | ${results.stats?.failed || 0} | ${Math.round((results.stats?.duration || 0) / 1000)}s |
              
              ${(results.stats?.failed || 0) > 0 ? '❌ Some tests failed. Check the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.' : '✅ All tests passed!'}
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              console.log('Test results file not found');
            }
          } catch (error) {
            console.log('Could not parse test results:', error.message);
          }
